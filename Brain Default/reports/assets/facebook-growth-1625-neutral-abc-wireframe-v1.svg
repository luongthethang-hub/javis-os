  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="300" width="270" height="420" rx="24" fill="#DDE7F5" stroke="#34495E" stroke-width="4"/>
    <rect x="405" y="300" width="270" height="420" rx="24" fill="#E7F2E4" stroke="#34495E" stroke-width="4"/>
