    <text x="855" y="500" font-size="120" font-weight="700" fill="#222">C</text>
    <text x="225" y="610" font-size="30" fill="#444">CẦN DỮ LIỆU</text>
    <text x="540" y="610" font-size="30" fill="#444">CẦN DỮ LIỆU</text>
    <text x="855" y="610" font-size="30" fill="#444">CẦN DỮ LIỆU</text>
    <text x="540" y="875" font-size="34" font-weight="700" fill="#B00020">LOCAL REHEARSAL • NOT PUBLISH-READY</text>
    <text x="540" y="930" font-size="26" fill="#555">Chưa gắn Page • chưa duyệt thương hiệu • không đăng</text>
